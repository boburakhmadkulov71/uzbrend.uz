<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <g id="hammer-crusher" transform="translate(20, 10)">
    <!-- Base Plate -->
    <path d="M 60 280 L 300 280 L 320 300 L 40 300 Z" fill="#b30000" stroke="#800000" stroke-width="2"/>
    <rect x="50" y="270" width="260" height="10" fill="#cc0000" stroke="#800000" stroke-width="1.5"/>
    <circle cx="70" cy="290" r="4" fill="#4d0000"/>
    <circle cx="120" cy="290" r="4" fill="#4d0000"/>
    <circle cx="240" cy="290" r="4" fill="#4d0000"/>
    <circle cx="290" cy="290" r="4" fill="#4d0000"/>

    <!-- Lower Body Stand & Support Frame -->
    <rect x="70" y="190" width="20" height="80" fill="#990000" stroke="#660000"/>
    <rect x="250" y="190" width="20" height="80" fill="#990000" stroke="#660000"/>
    <path d="M 90 190 L 250 190 L 240 270 L 100 270 Z" fill="#cc0000"/>
    <rect x="110" y="210" width="120" height="50" fill="#b30000" stroke="#800000"/>

    <!-- Top Hopper / Feed Chute -->
    <polygon points="120,40 220,40 230,80 110,80" fill="#e60000" stroke="#990000" stroke-width="2"/>
    <rect x="115" y="30" width="110" height="10" fill="#b30000" stroke="#800000"/>

    <!-- Main Crusher Body / Housing -->
    <rect x="80" y="80" width="180" height="110" fill="#ff1a1a" stroke="#b30000" stroke-width="2"/>
    
    <!-- Heavy Side Ribs & Reinforcements -->
    <rect x="95" y="90" width="15" height="90" fill="#cc0000"/>
    <rect x="120" y="90" width="15" height="90" fill="#cc0000"/>
    <rect x="210" y="90" width="15" height="90" fill="#cc0000"/>
    <rect x="235" y="90" width="15" height="90" fill="#cc0000"/>

    <!-- Front Extension Box (Left side) -->
    <path d="M 40 140 L 80 120 L 80 190 L 40 180 Z" fill="#e60000" stroke="#990000" stroke-width="2"/>
    <rect x="35" y="140" width="10" height="40" fill="#b30000"/>
    <circle cx="60" cy="150" r="5" fill="#800000"/>
    <circle cx="60" cy="170" r="5" fill="#800000"/>

    <!-- Bolt/Rivet Details on Main Housing -->
    <g fill="#800000">
      <circle cx="150" cy="100" r="3"/>
      <circle cx="165" cy="105" r="3"/>
      <circle cx="180" cy="115" r="3"/>
      <circle cx="190" cy="130" r="3"/>
      <circle cx="195" cy="150" r="3"/>
      <circle cx="190" cy="170" r="3"/>
      <circle cx="175" cy="180" r="3"/>
      <circle cx="150" cy="185" r="3"/>
    </g>

    <!-- Side Handles / Mounting Brackets -->
    <path d="M 145 95 H 160 V 120 H 145 Z" fill="#none" stroke="#800000" stroke-width="4"/>
    <path d="M 175 95 H 190 V 120 H 175 Z" fill="#none" stroke="#800000" stroke-width="4"/>

    <!-- Main Drive Shaft Pulley (Flywheel/Belt Wheel - Right side) -->
    <g id="pulley" transform="translate(230, 145)">
      <!-- Outer Rim (3D effect) -->
      <ellipse cx="40" cy="20" rx="35" ry="45" fill="#990000" stroke="#660000" stroke-width="2"/>
      <ellipse cx="35" cy="20" rx="33" ry="43" fill="#ff1a1a" stroke="#b30000" stroke-width="2"/>
      <!-- Grooves -->
      <ellipse cx="35" cy="20" rx="28" ry="38" fill="#cc0000" stroke="#990000" stroke-width="1.5"/>
      <ellipse cx="35" cy="20" rx="23" ry="33" fill="#e60000"/>
      <!-- Inner Shaft Hub -->
      <ellipse cx="35" cy="20" rx="12" ry="16" fill="#800000"/>
      <ellipse cx="33" cy="20" rx="8" ry="11" fill="#4d0000"/>
    </g>

    <!-- Small Motor Housing behind pulley -->
    <rect x="290" y="130" width="40" height="50" fill="#008080" rx="5" stroke="#004d4d" stroke-width="2"/>
    <path d="M 330 135 L 340 140 L 340 175 L 330 170 Z" fill="#006666"/>
  </g>
</svg>
